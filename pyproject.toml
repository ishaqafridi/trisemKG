[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trisemkg"
version = "1.0.0"
description = "Three-layer semantic framework for multi-modal biomedical knowledge graph construction (EHR/EMR, multimedia, multi-omics)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muhammad Ishaq", email = "drmishaq@aup.edu.pk"}]
keywords = ["knowledge graph", "precision medicine", "ontology mapping", "EHR", "FHIR", "OMOP", "multi-omics", "DICOM", "PrimeKG"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics",
               "Topic :: Scientific/Engineering :: Medical Science Apps."]
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0", "networkx>=3.0", "pillow>=10.0", "rdflib>=7.0"]

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]
shacl = ["pyshacl>=0.25"]
dev = ["pytest>=7", "pytest-cov", "ruff"]
all = ["pydicom>=2.4", "pyshacl>=0.25"]

[project.scripts]
trisemkg = "trisemkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905"]
