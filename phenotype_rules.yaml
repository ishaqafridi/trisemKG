# Layer 2 rule-based semantic enrichment: numeric EHR measurements -> HPO phenotypes.
# Thresholds follow common clinical cut-offs and are intended as defaults to review.
rules:
  - id: R1_hba1c_hyperglycemia
    lab_test: LOINC:4548-4
    operator: ">="
    threshold: 6.5
    unit: "%"
    phenotype: HP:0003074
  - id: R2_glucose_hyperglycemia
    lab_test: LOINC:2345-7
    operator: ">="
    threshold: 126
    unit: mg/dL
    phenotype: HP:0003074
  - id: R3_sbp_hypertension
    lab_test: LOINC:8480-6
    operator: ">="
    threshold: 140
    unit: mm[Hg]
    phenotype: HP:0000822
  - id: R4_bmi_obesity
    lab_test: LOINC:39156-5
    operator: ">="
    threshold: 30
    unit: kg/m2
    phenotype: HP:0001513
  - id: R5_creatinine_elevated
    lab_test: LOINC:2160-0
    operator: ">"
    threshold: 1.3
    unit: mg/dL
    phenotype: HP:0003259
